            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~((I0 & ~S0) | (I1 & S0))
    cells:
        - MUX2N_DL
        - MUX2N_D1
    optional:
        latex: "Y = \\overline{ (I0 \\cdot \\overline{S0} + I1 \\cdot S0) }"

