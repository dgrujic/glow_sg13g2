        S1:
            type: input
            description: "Select control signal bit 1"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  (I0 & ~S0 & ~S1) | (I1 & S0 & ~S1) | (I2 & S1)
    cells:
        - MUX3_DL
        - MUX3_D1
    optional:
        latex: "Y = (I0 \\cdot \\overline{S0} \\cdot \\overline{S1} + I1 \\cdot S0 \\cdot \\overline{S1} + I2 \\cdot S1)"

MUX4:
