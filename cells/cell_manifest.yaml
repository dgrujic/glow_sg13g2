            description: "Ground"
    function:
        Y:  (I0 & ~S0) | (I1 & S0)
    cells:
        - MUX2_DL
        - MUX2_D1
    optional:
        latex: "Y = (I0 \\cdot \\overline{S0} + I1 \\cdot S0)"

