#
# GLOW SG13G2 Standard digital library
# Standard cell manifest
#

#
# AND
#

AND2:
    description: "Two input AND gate"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A"
        B:
            type: input
            description: "Input B"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  A & B
    cells:
        - AND2_DL
        - AND2_D1
        - AND2_D2
        - AND2_D4
    optional:
        latex: "Y = A \\cdot B"

AND3:
    description: "Three input AND gate"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A"
        B:
            type: input
            description: "Input B"
        C:
            type: input
            description: "Input C"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  A & B & C
    cells:
        - AND3_DL
        - AND3_D1
        - AND3_D2
        - AND3_D4
    optional:
        latex: "Y = A \\cdot B \\cdot C"

AND4:
    description: "Four input AND gate"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A"
        B:
            type: input
            description: "Input B"
        C:
            type: input
            description: "Input C"
        D:
            type: input
            description: "Input D"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  A & B & C & D
    cells:
        - AND4_DL
        - AND4_D1
        - AND4_D2
        - AND4_D4
    optional:
        latex: "Y = A \\cdot B \\cdot C \\cdot D"

#
# AND - OR 
#

AO21:
    description: "AND-OR gate with two AND inputs and one direct OR input"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, connected to AND gate"
        B:
            type: input
            description: "Input B, connected to AND gate"
        C:
            type: input
            description: "Input C, direct input to OR gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  (A & B) | C
    cells:
        - AO21_DL
        - AO21_D1
        - AO21_D2
    optional:
        latex: "Y = (A \\cdot B) + C"

AO22:
    description: "AND-OR gate with two two-input AND gates"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, connected to first AND gate"
        B:
            type: input
            description: "Input B, connected to first AND gate"
        C:
            type: input
            description: "Input C, connected to second AND gate"
        D:
            type: input
            description: "Input D, connected to second AND gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  (A & B) | (C & D)
    cells:
        - AO22_DL
        - AO22_D1
        - AO22_D2
    optional:
        latex: "Y = (A \\cdot B) + (C \\cdot D)"

#
# AND - OR - INV
#

AOI21:
    description: "Inverted output AND-OR gate with two AND inputs and one direct OR input"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, connected to AND gate"
        B:
            type: input
            description: "Input B, connected to AND gate"
        C:
            type: input
            description: "Input C, direct input to OR gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~((A & B) | C)
    cells:
        - AOI21_DL
        - AOI21_D1
        - AOI21_D2
    optional:
        latex: "Y = \\overline{(A \\cdot B) + C}"

AOI22:
    description: "Inverted output AND-OR gate with two two-input AND gates"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, connected to first AND gate"
        B:
            type: input
            description: "Input B, connected to first AND gate"
        C:
            type: input
            description: "Input C, connected to second AND gate"
        D:
            type: input
            description: "Input D, connected to second AND gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~((A & B) | (C & D))
    cells:
        - AOI22_DL
        - AOI22_D1
    optional:
        latex: "Y = \\overline{(A \\cdot B) + (C \\cdot D)}"

AOI211:
    description: "Inverted output AND-OR gate with two input AND gate and two direct inputs to OR gate"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, connected to AND gate"
        B:
            type: input
            description: "Input B, connected to AND gate"
        C:
            type: input
            description: "Input C, connected to OR gate"
        D:
            type: input
            description: "Input D, connected to OR gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~((A & B) | C | D)
    cells:
        - AOI211_DL
        - AOI211_D1
        - AOI211_D2
    optional:
        latex: "Y = \\overline{(A \\cdot B) + C + D}"

AOI221:
    description: "Inverted output AND-OR gate with two two-input AND gates and one direct input to OR gate"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, connected to first AND gate"
        B:
            type: input
            description: "Input B, connected to first AND gate"
        C:
            type: input
            description: "Input C, connected to second AND gate"
        D:
            type: input
            description: "Input D, connected to second AND gate"
        E:
            type: input
            description: "Input E, connected to OR gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~(((A & B) | (C & D)) | E)
    cells:
        - AOI221_DL
        - AOI221_D1
    optional:
        latex: "Y = \\overline{(A \\cdot B) + (C \\cdot D) + E}"

AOI222:
    description: "Inverted output AND-OR gate with three two-input AND gates"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, connected to first AND gate"
        B:
            type: input
            description: "Input B, connected to first AND gate"
        C:
            type: input
            description: "Input C, connected to second AND gate"
        D:
            type: input
            description: "Input D, connected to second AND gate"
        E:
            type: input
            description: "Input E, connected to third AND gate"
        F:
            type: input
            description: "Input F, connected to third AND gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~((A & B) | (C & D) | (E & F))
    cells:
        - AOI222_DL
        - AOI222_D1
    optional:
        latex: "Y = \\overline{(A \\cdot B) + (C \\cdot D) + (E \\cdot F)}"

AOI2N1:
    description: "Inverted output AND-OR gate with two inverted AND inputs and one direct OR input. Eqivalent to OR-AND gate with inverted direct OR input."
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, inverted and connected to AND gate"
        B:
            type: input
            description: "Input B, inverted and connected to AND gate"
        C:
            type: input
            description: "Input C, direct input to OR gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~((~A & ~B) | C)
    cells:
        - AOI2N1_DL
        - AOI2N1_D1
        - AOI2N1_D2
    optional:
        latex: "Y = \\overline{(\\overline{A} \\cdot \\overline{B}) + C}"

AOI2N2:
    description: "Inverted output AND-OR gate with two two-input AND gates. One AND gate has inverted inputs."
    type: combinatorial
    pins:
        A:
            type: input
            description: "Input A, inverted and connected to first AND gate"
        B:
            type: input
            description: "Input B, inverted and connected to first AND gate"
        C:
            type: input
            description: "Input C,  connected to second AND gate"
        D:
            type: input
            description: "Input D,  connected to second AND gate"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~((~A & ~B) | (C & D))
    cells:
        - AOI2N1_DL
        - AOI2N2_D1
    optional:
        latex: "Y = \\overline{(\\overline{A} \\cdot \\overline{B}) + (C \\cdot B)}"

#
# Buffers
#

BUF:
    description: "Standard buffer"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Buffer input"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  A
    cells:
        - BUF_DL
        - BUF_D1
        - BUF_D2
        - BUF_D3
        - BUF_D4
        - BUF_D6
        - BUF_D8
        - BUF_D12
    optional:
        latex: "Y = A"

#
# Clock buffers
#

CLKBUF:
    description: "Clock buffer for clock tree synthesis"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Buffer input"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  A
    cells:
        - CLKBUF_D1
        - CLKBUF_D2
        - CLKBUF_D3
        - CLKBUF_D4
        - CLKBUF_D6
        - CLKBUF_D8
        - CLKBUF_D12
        - CLKBUF_D16
    optional:
        latex: "Y = A"

#
# Clock inverters
#

CLKINV:
    description: "Inverter for clock signals"
    type: combinatorial
    pins:
        A:
            type: input
            description: "Buffer input"
        Y:
            type: output
            description: "Output"
        VDD:
            type: power
            description: "Power supply"
        VSS:
            type: ground
            description: "Ground"
    function:
        Y:  ~A
    cells:
        - CLKINV_D1
        - CLKINV_D2
        - CLKINV_D4
        - CLKINV_D8
        - CLKINV_D16
    optional:
        latex: "Y = \\overline{A}"

